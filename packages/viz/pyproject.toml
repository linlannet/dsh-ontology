[project]
name = "dsh-onto-viz"
version = "0.2.0"
description = "可视化包：图谱查询与展示数据组装"
requires-python = ">=3.12"
dependencies = ["dsh-onto-base"]

[tool.uv.sources]
dsh-onto-base = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dsh_onto_viz"]
