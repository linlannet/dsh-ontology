[project]
name = "dsh-onto-base"
version = "0.2.0"
description = "平台基础包：配置、双库会话、租户中间件、插件协议"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "sqlalchemy[asyncio]>=2.0",
    "pyjwt>=2.8",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
db = ["asyncmy>=0.2.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dsh_onto_base"]

[tool.hatch.build.targets.wheel.force-include]
"src/dsh_onto_base/resources" = "dsh_onto_base/resources"
