[project]
name = "dsh-onto-flow"
version = "0.2.0"
description = "流程包：个人层沉淀、全局汇聚与 workline 编排"
requires-python = ">=3.12"
dependencies = [
    "dsh-onto-base",
    "bcrypt>=4.0",
    "httpx>=0.27",
]

[tool.uv.sources]
dsh-onto-base = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dsh_onto_flow"]
