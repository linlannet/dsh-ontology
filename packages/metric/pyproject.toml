[project]
name = "dsh-onto-metric"
version = "0.2.0"
description = "指标包：指标采集与统计（5 张 onto_metric_* 表）"
requires-python = ">=3.12"
dependencies = ["dsh-onto-base"]

[tool.uv.sources]
dsh-onto-base = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dsh_onto_metric"]
