[project]
name = "dsh-onto-qa"
version = "0.2.0"
description = "报告与问数包：报告、问数、分析任务（R 域）"
requires-python = ">=3.12"
dependencies = ["dsh-onto-base"]

[tool.uv.sources]
dsh-onto-base = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dsh_onto_qa"]
