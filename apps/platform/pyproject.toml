[project]
name = "dsh-ontology-app"
version = "0.2.0"
description = "平台应用：聚合 5 个平台包，监听 8093"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "dsh-onto-base",
    "dsh-onto-flow",
    "dsh-onto-qa",
    "dsh-onto-viz",
    "dsh-onto-metric",
]

[project.scripts]
dsh-ontology = "dsh_ontology.main:run"

[tool.uv.sources]
dsh-onto-base = { workspace = true }
dsh-onto-flow = { workspace = true }
dsh-onto-qa = { workspace = true }
dsh-onto-viz = { workspace = true }
dsh-onto-metric = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dsh_ontology"]
